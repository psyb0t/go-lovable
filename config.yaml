package: lovable
generate:
  client: true
  models: true
output: client.gen.go
output-options:
  resolve-type-name-collisions: true
  # Required nullable fields must preserve JSON null, including on re-encoding.
  nullable-type: true
  # Keep numeric metrics and credit amounts out of float32.
  type-mapping:
    number:
      default:
        type: float64
compatibility:
  always-prefix-enum-values: true
