title = "go-lovable secret scanning"

[extend]
useDefault = true

# gitleaks' `dir` mode walks the working tree and does NOT honour .gitignore, so
# every gitignored local path is named again here. Nothing gitignored is tracked
# by git. The committed Go vendor/ tree is intentionally NOT listed: it ships to
# consumers, so it gets scanned. Verify with `git check-ignore <path>` before
# adding a line; an entry for a committed source path silences real leaks.
[[allowlists]]
description = "Gitignored local scratch, downloaded specs, caches, and scan artifacts"
paths = [
  '''(^|/)\.env$''',
  '''(^|/)\.vscode(?:/|$)''',
  '''(^|/)\.telemetry(?:/|$)''',
  '''(^|/)\.research_files(?:/|$)''',
  '''(^|/)\.testing(?:/|$)''',
  '''(^|/)api/openapi(?:\.fixed)?\.yaml$''',
  '''(^|/)__pycache__(?:/|$)''',
  '''(^|/)sec\.sarif$''',
  '''(^|/)git-update\.sh(?:\.debot)?$''',
  '''(^|/)CLAUDE\.md$''',
]

# The published embed URL example contains a JWT header without a payload or
# signature. Allow only that exact sample, only in generated documentation.
[[allowlists]]
description = "JWT header in Lovable's published embed URL example"
condition = "AND"
paths = ['''(^|/)client\.gen\.go$''']
regexTarget = "secret"
regexes = ['''^eyJhbGciOiJIUzI1NiJ9$''']
